<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Library | DONPONLINE</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../crunkville/crunkville.css"></head><body class="cv-page"><header class="cv-header"><a class="brand" href="../../index.html"><span class="cv-brandmark">DP</span><span>DONPONLINE</span></a><nav><a href="../../crunkville/">Crunkville</a><a href="../../members.html">Wallet</a></nav></header><main><section class="cv-section" style="padding-top:150px;min-height:80vh"><div class="cv-heading"><div><p>YOUR ACCOUNT</p><h2>MY LIBRARY.</h2></div><span id="library-balance"></span></div><div id="library-content" class="episode-grid"><p class="cv-loading">Loading your collection…</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../assets/js/supabase-config.js"></script><script>const c=supabase.createClient(DONPONLINE_CONFIG.supabaseUrl,DONPONLINE_CONFIG.supabasePublishableKey);(async()=>{const{data:{user}}=await c.auth.getUser(),box=document.querySelector('#library-content');if(!user){box.innerHTML='<article class="episode-card"><div class="episode-copy"><h3>SIGN IN TO YOUR LIBRARY</h3><p>Your permanent Crunkville purchases and progress will appear here.</p><a class="cv-button primary" href="../../members.html">Sign In</a></div></article>';return}const[w,e,u,p,col]=await Promise.all([c.from('wallets').select('balance').eq('user_id',user.id).single(),c.from('crunkville_episodes').select('*').order('episode_number'),c.from('crunkville_user_unlocks').select('*').eq('user_id',user.id),c.from('crunkville_watch_progress').select('*').eq('user_id',user.id),c.from('user_collectibles').select('*').eq('user_id',user.id)]);document.querySelector('#library-balance').textContent=`${w.data?.balance||0} MOTION COINS`;const owned=x=>x.is_free||(u.data||[]).some(y=>y.episode_id===x.id||['complete_series','premium_bundle'].includes(y.unlock_type));const cards=(e.data||[]).filter(owned).map(x=>{const pr=(p.data||[]).find(y=>y.episode_id===x.id);return `<article class="episode-card owned"><div class="episode-art"><span>0${x.episode_number}</span><b>▶</b></div><div class="episode-copy"><small>${pr?.completed?'✓ COMPLETED':pr?.progress_seconds?'CONTINUE WATCHING':x.is_free?'FREE':'OWNED'}</small><h3>${x.title}</h3><p>${x.description}</p><a class="cv-button primary" href="../../crunkville/watch/?episode=${x.slug}">${pr?.progress_seconds&&!pr.completed?'Resume':'Watch'}</a></div></article>`});const collectibles=(col.data||[]).map(x=>`<article class="episode-card"><div class="episode-copy"><small>${x.collectible_type.replace('_',' ')}</small><h3>${x.title}</h3><p>Exclusive Crunkville collectible</p></div></article>`);box.innerHTML=[...cards,...collectibles].join('')||'<p>Your library is ready. Start with the free first episode.</p>'})()</script></body></html>
